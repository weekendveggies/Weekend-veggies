<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekend Veggies — Admin Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper: #FBF6EC;
    --paper-dim: #F3EBDA;
    --ink: #143B22;
    --ink-soft: #52684F;
    --green: #5FA82A;
    --green-dark: #1F5C2E;
    --tomato: #C1442D;
    --carrot: #DB8A1F;
    --line: rgba(36,48,31,0.14);
    --card: #FFFFFF;
    --shadow: 0 2px 0 rgba(36,48,31,0.06), 0 10px 24px -12px rgba(36,48,31,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  h1,h2,.display{font-family:Georgia,"Times New Roman",serif; font-weight:700; letter-spacing:-0.01em;}
  button{font-family:inherit; cursor:pointer;}

  /* ---- Login screen ---- */
  .login-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:32px 28px; width:100%; max-width:340px; box-shadow:var(--shadow);
  }
  .login-card h1{font-size:22px; margin:0 0 4px;}
  .login-card p{font-size:13px; color:var(--ink-soft); margin:0 0 20px;}
  .login-card label{display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin:14px 0 6px;}
  .login-card input{
    width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:9px; font-size:14px;
  }
  .login-btn{
    width:100%; margin-top:20px; background:var(--green); color:#fff; border:none;
    padding:12px; border-radius:9px; font-weight:700; font-size:14px;
  }
  .login-error{color:var(--tomato); font-size:12.5px; margin-top:10px; display:none;}

  /* ---- Dashboard ---- */
  .topbar{
    background:var(--ink); color:var(--paper); padding:14px 20px;
